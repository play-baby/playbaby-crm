<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول | {{ site_name }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Tajawal', sans-serif !important; }
    body {
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-box { width: 420px; }
    .card {
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(220,20,60,0.15), 0 0 120px rgba(220,20,60,0.03);
      border: 1px solid rgba(220,20,60,0.12);
      background: #111;
    }
    .card-header {
      background: linear-gradient(135deg, #0a0a0a 0%, #1a0000 50%, #0a0a0a 100%);
      text-align: center;
      padding: 40px 30px 30px;
      border-bottom: 2px solid var(--pb-red, #dc143c);
    }
    .login-logo {
      width: 200px; height: auto;
      background: transparent;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 15px;
      box-shadow: none;
      padding: 0;
    }
    .login-logo img { max-width: 100%; height: auto; border-radius: 8px; }
    .card-header h3 {
      font-weight: 800;
      font-size: 1.7rem;
      background: linear-gradient(135deg, #dc143c, #ff1744);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0;
      letter-spacing: 1px;
    }
    .card-header p { color: rgba(255,255,255,0.4); margin-top: 8px; font-size: 0.85rem; }
    .card-body { padding: 35px; background: #111; }
    .form-group label { color: rgba(255,255,255,0.7); font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; }
    .form-control {
      border-radius: 12px;
      padding: 12px 16px;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #fff;
      transition: all 0.3s;
    }
    .form-control:focus {
      background: #222;
      border-color: #dc143c;
      box-shadow: 0 0 0 4px rgba(220,20,60,0.12);
      color: #fff;
    }
    .form-control::placeholder { color: rgba(255,255,255,0.2); }
    .input-group-text {
      border-radius: 12px 0 0 12px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-left: none;
      color: #dc143c;
    }
    .login-btn {
      background: linear-gradient(135deg, #dc143c, #ff1744);
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-weight: 700;
      font-size: 1.05rem;
      transition: all 0.3s;
      margin-top: 15px;
      color: #fff;
    }
    .login-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(220,20,60,0.35);
      color: #fff;
    }
    .alert-danger {
      background: rgba(220,20,60,0.08);
      border: 1px solid rgba(220,20,60,0.2);
      color: #ff6b81;
      border-radius: 12px;
      font-size: 0.9rem;
    }
    .footer-text { text-align: center; color: rgba(255,255,255,0.2); font-size: 0.75rem; margin-top: 25px; }
    hr { border-color: #222; }
  </style>
</head>
<body class="hold-transition login-page">
<div class="login-box">
  <div class="card">
    <div class="card-header">
      <div class="login-logo">
        {% if site_logo %}
        <img src="{{ site_logo }}" alt="Play Baby" style="max-width:80%;max-height:80px;">
        {% else %}💋{% endif %}
      </div>
      <h3>Play Baby Lingerie</h3>
      <p>نظام إدارة متكامل</p>
    </div>
    <div class="card-body">
      {% if form.errors %}
      <div class="alert alert-danger">
        <i class="fas fa-exclamation-circle ml-2"></i> اسم المستخدم أو كلمة المرور غير صحيحة
      </div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label for="id_username">اسم المستخدم</label>
          <div class="input-group">
            <div class="input-group-prepend">
              <span class="input-group-text"><i class="fas fa-user"></i></span>
            </div>
            <input type="text" name="username" id="id_username" class="form-control" placeholder="أدخل اسم المستخدم" required autofocus>
          </div>
        </div>
        <div class="form-group">
          <label for="id_password">كلمة المرور</label>
          <div class="input-group">
            <div class="input-group-prepend">
              <span class="input-group-text"><i class="fas fa-lock"></i></span>
            </div>
            <input type="password" name="password" id="id_password" class="form-control" placeholder="أدخل كلمة المرور" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block login-btn">
          <i class="fas fa-sign-in-alt ml-2"></i> تسجيل الدخول
        </button>
      </form>
      <div class="footer-text">
        Play Baby Lingerie CRM &copy; {{ current_year }}
      </div>
    </div>
  </div>
</div>
</body>
</html>
